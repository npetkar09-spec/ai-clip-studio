# DRAFT, not yet run. Start it by hand: Actions tab -> build-apk -> Run workflow.
name: build-apk
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ai-clip-studio-apk
          path: build-app/android/app/build/outputs/apk/release/app-release.apk
